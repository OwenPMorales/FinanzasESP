<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinanzasESP</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #ffffff; --text: #1e293b; --muted: #64748b;
    --line: #e2e8f0; --accent: #0f766e; --accent-soft: #ccfbf1; --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
            --line: #334155; --accent: #2dd4bf; --accent-soft: #134e4a; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: var(--accent); }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); }
  input { flex: 1 1 160px; min-width: 0; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: none; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .muted { color: var(--muted); font-size: 13px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px; text-align: center;
          color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .ticket { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .ticket img, .ticket .pdf { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--line); }
  .ticket .pdf { display: grid; place-items: center; font-weight: 600; color: var(--muted); }
  .ticket .info { padding: 8px 10px; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px;
           background: var(--accent-soft); color: var(--accent); }
  .key { font-family: ui-monospace, monospace; word-break: break-all; background: var(--accent-soft);
         padding: 8px; border-radius: 6px; margin-top: 8px; }
  #msg { min-height: 20px; font-size: 14px; }
  #msg.err { color: var(--danger); }
  .hidden { display: none !important; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Finanzas<span>ESP</span></h1>
  <div class="row">
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost hidden">Salir</button>
    <a class="muted" href="/docs">API docs</a>
  </div>
</header>

<main>
  <div id="msg"></div>

  <section id="auth" class="card">
    <h2>Entrar o crear cuenta</h2>
    <div class="row">
      <input id="u" placeholder="usuario o correo" autocomplete="username">
      <input id="e" placeholder="correo (solo registro)" type="email">
      <input id="p" placeholder="contraseña (8+, letra y número)" type="password" autocomplete="current-password">
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnLogin">Entrar</button>
      <button id="btnRegister" class="ghost">Crear cuenta</button>
    </div>
  </section>

  <section id="app" class="hidden" style="display:grid; gap:16px">
    <div class="card">
      <h2>Subir ticket de compra</h2>
      <label class="drop" id="drop">
        Arrastra aquí la foto o PDF del ticket, o haz clic para elegirlo
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
      </label>
      <p class="muted">Se guarda en MinIO y queda <b>pendiente</b> de lectura por IA (v02).</p>
    </div>

    <div class="card">
      <h2>Mis tickets <span id="count" class="muted"></span></h2>
      <div id="tickets" class="grid"></div>
    </div>

    <div class="card">
      <h2>Dispositivos ESP32</h2>
      <div class="row">
        <input id="devName" placeholder="Nombre, ej. ESP32-S3 cocina">
        <button id="btnDevice">Vincular dispositivo</button>
      </div>
      <div id="newKey" class="hidden"></div>
      <table id="devices"></table>
    </div>
  </section>
</main>

<script>
const API = "/api/v1";
let access = sessionStorage.getItem("access");
let refresh = sessionStorage.getItem("refresh");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function msg(text, error = false) {
  $("msg").textContent = text || "";
  $("msg").className = error ? "err" : "";
}

function saveTokens(t) {
  access = t.access_token; refresh = t.refresh_token;
  try { sessionStorage.setItem("access", access); sessionStorage.setItem("refresh", refresh); } catch {}
}

function clearTokens() {
  access = refresh = null;
  try { sessionStorage.clear(); } catch {}
}

// Si el access token expira, se intenta una vez con el refresh token (rotación).
async function api(path, options = {}, retry = true) {
  const headers = { ...(options.headers || {}) };
  if (access) headers.Authorization = `Bearer ${access}`;
  const res = await fetch(API + path, { ...options, headers });
  if (res.status === 401 && retry && refresh) {
    const r = await fetch(API + "/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    if (r.ok) { saveTokens(await r.json()); return api(path, options, false); }
    clearTokens(); show();
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { const b = await res.json(); detail = typeof b.detail === "string" ? b.detail : JSON.stringify(b.detail); } catch {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

async function login() {
  const body = new URLSearchParams({ username: $("u").value, password: $("p").value });
  try {
    saveTokens(await api("/auth/token", { method: "POST", body }));
    msg(""); show();
  } catch (e) { msg(e.message, true); }
}

async function register() {
  try {
    await api("/auth/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value, email: $("e").value, password: $("p").value }),
    });
    msg("Cuenta creada."); await login();
  } catch (e) { msg(e.message, true); }
}

async function logout() {
  if (refresh) await api("/auth/logout", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: refresh }),
  }).catch(() => {});
  clearTokens(); show();
}

async function upload(file) {
  if (!file) return;
  const form = new FormData(); form.append("file", file);
  msg("Subiendo...");
  try { await api("/tickets/", { method: "POST", body: form }); msg("Ticket guardado en MinIO."); loadTickets(); }
  catch (e) { msg(e.message, true); }
}

async function loadTickets() {
  const list = await api("/tickets/?limit=50");
  $("count").textContent = `(${list.length})`;
  const box = $("tickets"); box.innerHTML = "";
  for (const t of list) {
    const d = await api(`/tickets/${t.id}`);
    const card = document.createElement("div"); card.className = "ticket";
    const preview = t.image_content_type === "application/pdf"
      ? `<a class="pdf" href="${d.image_url}" target="_blank">PDF</a>`
      : `<a href="${d.image_url}" target="_blank"><img src="${d.image_url}" alt="ticket"></a>`;
    card.innerHTML = `${preview}<div class="info">
      <span class="badge">${t.status}</span> <span class="muted">${t.source}</span><br>
      ${new Date(t.created_at).toLocaleString()}<br>
      <span class="muted">${(t.image_size / 1024).toFixed(0)} KB</span>
      <button class="danger" style="float:right;padding:2px 8px">Borrar</button></div>`;
    card.querySelector("button").onclick = async () => {
      if (!confirm("¿Borrar este ticket?")) return;
      await api(`/tickets/${t.id}`, { method: "DELETE" }); loadTickets();
    };
    box.appendChild(card);
  }
  if (!list.length) box.innerHTML = '<p class="muted">Aún no hay tickets.</p>';
}

async function loadDevices() {
  const list = await api("/devices/");
  $("devices").innerHTML = list.map((d) => `<tr>
    <td>${esc(d.name)}</td><td class="muted">${esc(d.key_prefix)}…</td>
    <td>${d.is_active ? '<span class="badge">activo</span>' : '<span class="muted">revocado</span>'}</td>
    <td class="muted">${d.last_seen_at ? "visto " + new Date(d.last_seen_at).toLocaleString() : "nunca conectado"}</td>
    <td>${d.is_active ? `<button class="danger" data-id="${d.id}">Revocar</button>` : ""}</td></tr>`).join("");
  $("devices").querySelectorAll("button").forEach((b) => b.onclick = async () => {
    await api(`/devices/${b.dataset.id}`, { method: "DELETE" }); loadDevices();
  });
}

async function addDevice() {
  try {
    const d = await api("/devices/", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: $("devName").value }),
    });
    $("newKey").className = "";
    $("newKey").innerHTML = `<p class="muted">Copia esta llave al SKILL del ESP32. No se volverá a mostrar:</p>
      <div class="key">${d.device_key}</div>`;
    $("devName").value = ""; loadDevices();
  } catch (e) { msg(e.message, true); }
}

async function show() {
  const logged = Boolean(access);
  $("auth").classList.toggle("hidden", logged);
  $("app").classList.toggle("hidden", !logged);
  $("logout").classList.toggle("hidden", !logged);
  $("who").textContent = "";
  if (!logged) return;
  try {
    const me = await api("/users/me");
    $("who").textContent = `${me.username} · ${me.currency}`;
    await Promise.all([loadTickets(), loadDevices()]);
  } catch (e) { msg(e.message, true); }
}

$("btnLogin").onclick = login;
$("btnRegister").onclick = register;
$("logout").onclick = logout;
$("btnDevice").onclick = addDevice;
$("file").onchange = (e) => upload(e.target.files[0]);
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files[0]); };
show();
</script>
</body>
</html>
